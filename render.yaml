services:
  - type: web
    name: backend-api
    env: python
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      pip install prisma
      npx prisma generate
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: DATABASE_URL
        fromDatabase:
          name: backend-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generate: true
      - key: ENVIRONMENT
        value: production

databases:
  - name: backend-db
    databaseName: healthcare_platform
    user: healthcare_user
