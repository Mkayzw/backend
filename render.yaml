services:
  # Backend API
  - type: web
    name: backend-api
    env: python
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      pip install prisma
      npx prisma generate
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: DATABASE_URL
        fromDatabase:
          name: backend-db
          property: connectionString
      - key: JWT_SECRET_KEY
        value: "d492aa0d8cbd8d50dd561819d869880ab677b306d7834d3bd35c57b8e9e2dbcf"
      - key: ENVIRONMENT
        value: production

  # Frontend (React + Vite)
  - type: web
    name: frontend
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm install && npx serve -s dist -l $PORT
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: backend-api
          property: url

databases:
  - name: backend-db
    databaseName: healthcare_platform
    user: healthcare_user
