services:
  # Backend API
  - type: web
    name: backend-api
    env: python
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      prisma generate
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: DATABASE_URL
        value: "postgresql://neondb_owner:npg_a4kGsqHPjIF3@ep-shiny-lab-am6fenvk-pooler.c-5.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require"
      - key: JWT_SECRET_KEY
        value: "d492aa0d8cbd8d50dd561819d869880ab677b306d7834d3bd35c57b8e9e2dbcf"
      - key: ENVIRONMENT
        value: production

  # Frontend (React + Vite)
  - type: web
    name: frontend
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm install && npx serve -s dist -l $PORT
    envVars:
      - key: VITE_API_URL
        value: "https://backend-api.onrender.com"
